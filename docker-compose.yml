version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api-holymoly.networksalas.com/api}
        VITE_APP_URL: ${VITE_APP_URL:-https://holymoly.networksalas.com}
    container_name: holymoly-frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.holymoly.rule=Host(`holymoly.networksalas.com`)"
      - "traefik.http.routers.holymoly.entrypoints=websecure"
      - "traefik.http.routers.holymoly.tls=true"
      - "traefik.http.routers.holymoly.tls.certresolver=cf"
      - "traefik.http.services.holymoly.loadbalancer.server.port=8080"
    networks:
      - traefik

networks:
  traefik:
    external: true
